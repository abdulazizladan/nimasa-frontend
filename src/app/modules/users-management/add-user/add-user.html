<div class="page-container">
  <div class="page-header">
    <h2>Add New User</h2>
    <button class="btn-ghost" (click)="cancel()">Back to List</button>
  </div>

  <div *ngIf="userStore.error()" class="error-message">{{ userStore.error() }}</div>

  <div class="card form-card">
    <form (ngSubmit)="onSubmit()" #form="ngForm">

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="userForm.info.firstName" required
            placeholder="Enter first name">
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="userForm.info.lastName" required
            placeholder="Enter last name">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="userForm.email" required
            placeholder="Enter email address">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="userForm.contact.phone"
            placeholder="Enter phone number">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" [(ngModel)]="userForm.role" required>
            <option value="admin">Admin</option>
            <option value="guest" selected>Guest</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Temporary Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="userForm.password" required
            placeholder="Set temporary password">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-ghost" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || userStore.saving()">
          {{ userStore.saving() ? 'Saving...' : 'Create User' }}
        </button>
      </div>
    </form>
  </div>
</div>
