<div class="page-container">
  <button type="button" class="back-link" (click)="cancel()"><app-icon name="arrow-left" /> Back to users</button>

  <header class="page-header">
    <div class="header-left">
      <h1 class="page-title">Add user</h1>
      <p class="subtitle">Admins manage everything; guests can only read the dashboards, KPIs and reports.</p>
    </div>
  </header>

  @if (userStore.error()) {
    <div class="alert alert-error" role="alert"><span>{{ userStore.error() }}</span></div>
  }

  <div class="card form-card">
    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="firstName">First name *</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="userForm.info.firstName" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="lastName">Last name *</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="userForm.info.lastName" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" [(ngModel)]="userForm.email" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="userForm.contact.phone" />
        </div>
        <div class="form-group">
          <label for="role">Role *</label>
          <select id="role" name="role" [(ngModel)]="userForm.role" required>
            <option value="guest">Guest (read only)</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">Temporary password *</label>
          <input type="password" id="password" name="password" [(ngModel)]="userForm.password" required autocomplete="new-password" />
          <span class="hint">Share it with the user; they should change it after their first login.</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || userStore.saving()">
          @if (userStore.saving()) { <span class="spinner-sm"></span> }
          Create user
        </button>
      </div>
    </form>
  </div>
</div>
