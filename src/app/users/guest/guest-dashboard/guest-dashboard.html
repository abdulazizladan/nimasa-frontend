<div class="dashboard">
  <header class="page-header">
    <div class="header-left">
      <h1 class="page-title">Performance overview</h1>
      <p class="subtitle">How every KPI is doing against its target in {{ year() }}.</p>
    </div>
    <div class="header-actions">
      <app-year-select label="Year"></app-year-select>
    </div>
  </header>

  <!-- Same data as the admin dashboard; links open the guest KPI pages -->
  <app-deliverables-overview [year]="year().toString()" audience="guest"></app-deliverables-overview>
</div>
