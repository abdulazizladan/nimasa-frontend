<div class="dashboard-container">
  <div class="dashboard-header">
    <div>
      <h2>Performance Overview</h2>
      <p class="text-muted">Welcome to the NIMASA Performance Management System (Guest View).</p>
    </div>
    <div class="year-filter">
      <label for="guest-year">Year</label>
      <select id="guest-year" [ngModel]="year" (ngModelChange)="onYearChange($event)">
        <option *ngFor="let y of years" [value]="y">{{ y }}</option>
      </select>
    </div>
  </div>

  <!-- Same data as the admin dashboard; guests can't open the admin pages, so nothing links out -->
  <app-deliverables-overview [year]="year" audience="guest"></app-deliverables-overview>
</div>
