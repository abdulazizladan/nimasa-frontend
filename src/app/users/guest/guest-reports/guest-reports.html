<div class="page">
  <header class="page-head">
    <div>
      <h1 class="page-title">Reports</h1>
      <p>Download a PDF report for a period, or for one KPI.</p>
    </div>
  </header>

  <div class="card">
    <fieldset class="kinds">
      <legend class="label-caps">Report</legend>
      <label class="kind" [class.on]="kind() === 'summary'">
        <input type="radio" name="report-kind" value="summary" [checked]="kind() === 'summary'" (change)="kind.set('summary')" />
        <span><b>Period summary</b><span class="muted">Headline figures, status by type and every KPI for a period</span></span>
      </label>
      <label class="kind" [class.on]="kind() === 'kpi'">
        <input type="radio" name="report-kind" value="kpi" [checked]="kind() === 'kpi'" (change)="kind.set('kpi')" />
        <span><b>Single KPI</b><span class="muted">One KPI's targets and actuals over the quarters, and its notes</span></span>
      </label>
    </fieldset>

    <div class="section">
      <app-period-picker></app-period-picker>
    </div>

    @if (kind() === 'summary') {
      <div class="section filters">
        <div class="field">
          <label for="report-type">Type</label>
          <select id="report-type" (change)="type.set($any($event.target).value)">
            <option value="" [selected]="!type()">All types</option>
            @for (t of typeOptions; track t.id) { <option [value]="t.id" [selected]="t.id === type()">{{ t.title }}</option> }
          </select>
        </div>
        <div class="field">
          <label for="report-owner">Department</label>
          <select id="report-owner" (change)="owner.set($any($event.target).value)">
            <option value="" [selected]="!owner()">All departments</option>
            @for (o of ownerOptions(); track o) { <option [value]="o" [selected]="o === owner()">{{ o }}</option> }
          </select>
        </div>
      </div>
    } @else {
      <div class="section filters">
        <div class="field grow">
          <label for="report-kpi">KPI</label>
          <select id="report-kpi" (change)="kpiId.set($any($event.target).value)">
            <option value="" [selected]="!kpiId()">Choose a KPI</option>
            @for (k of kpiOptions(); track k.id) { <option [value]="k.id" [selected]="k.id === kpiId()">{{ k.label }}</option> }
          </select>
        </div>
      </div>
    }

    <div class="section download">
      <p class="preview"><b>{{ kind() === 'summary' ? 'Performance report' : 'KPI report' }} · {{ periodName() }}.</b> {{ preview() }}</p>
      <button type="button" class="btn btn-primary" (click)="download()" [disabled]="!canDownload()">
        <app-icon name="download" /> {{ downloading() ? 'Preparing PDF…' : 'Download PDF' }}
      </button>
      @if (message(); as m) {
        <p class="status" [class.alert]="m.kind === 'error'" [class.alert-error]="m.kind === 'error'" [class.ok]="m.kind === 'ok'" role="status">{{ m.text }}</p>
      }
    </div>
  </div>
</div>
