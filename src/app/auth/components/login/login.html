<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="/logo.webp" alt="NIMASA Logo" class="brand-logo" />
      <h2>Welcome Back</h2>
      <p>Please log in to your account</p>
    </div>
    
    <div *ngIf="authStore.error()" class="error-message" style="color: #ed1c24; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; text-align: center;">
      {{ authStore.error() }}
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="credentials.email" placeholder="Enter your email" required />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" placeholder="Enter your password" required />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="!loginForm.form.valid || authStore.loading()">
        {{ authStore.loading() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>
    
    <div class="login-footer">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </div>
</div>
