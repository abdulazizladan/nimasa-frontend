<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="/logo.webp" alt="NIMASA" class="brand-logo" width="120" height="120" />
      <h1>Welcome back</h1>
      <p>Log in to the Performance Monitoring System</p>
    </div>

    @if (authStore.error()) {
      <div class="alert alert-error" role="alert"><span>{{ authStore.error() }}</span></div>
    }

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" [(ngModel)]="credentials.email" placeholder="you@nimasa.gov.ng"
          autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" placeholder="Your password"
          autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="!loginForm.form.valid || authStore.loading()">
        {{ authStore.loading() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="login-footer">Accounts are created by an administrator. Contact yours if you need access.</p>
  </div>
</div>
